<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC5 — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #d4a574;
            --accent-dark: #9b7653;
            --border: #30363d;
            --error: #f85149;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 48px 40px;
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1rem;
            letter-spacing: 4px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
        }

        input[type="password"]::placeholder {
            letter-spacing: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        button[type="submit"] {
            width: 100%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: var(--accent-dark);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--error);
            border-radius: 4px;
            color: #ff8a80;
            font-size: 0.85rem;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">UFC5</div>
        <div class="tagline">Fight Archive</div>
        <form id="loginForm" novalidate>
            <label for="password">Access Code</label>
            <input type="password" id="password" placeholder="Enter access code" autocomplete="current-password" autofocus>
            <button type="submit" id="submitBtn">Enter</button>
        </form>
        <div id="errorMsg" class="error hidden"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (!password) return;

            btn.disabled = true;
            btn.textContent = 'Checking…';
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = 'Incorrect access code.';
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Enter';
                    document.getElementById('password').select();
                }
            } catch {
                errorMsg.textContent = 'Network error — try again.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Enter';
            }
        });
    </script>
</body>
</html>
